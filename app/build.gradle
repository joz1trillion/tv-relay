plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joz.tvrelay'
    compileSdk 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'com.joz.tvrelay'
        minSdk 29 // AudioPlaybackCapture needs Android 10
        targetSdk 34
        versionCode 15
        versionName '1.2'
        // Published as a GitHub pre-release? Shown next to the version before the app has
        // checked GitHub, so a fresh install says the same on the TV and the phone.
        buildConfigField 'boolean', 'PRERELEASE', 'true'
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
